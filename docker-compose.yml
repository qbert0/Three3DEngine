services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_MEDIA_BASE_URL: ""
      MINIO_ENDPOINT: http://minio:9000
      MARIADB_HOST: mariadb
    depends_on:
      - minio
      - mariadb

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: view360
      MINIO_ROOT_PASSWORD: view360-secret
    volumes:
      - minio-data:/data

  mariadb:
    image: mariadb:11
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: view360-root
      MARIADB_DATABASE: view360
      MARIADB_USER: view360
      MARIADB_PASSWORD: view360-pass
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  minio-data:
  mariadb-data:
