      - id: h1791363976191
        label: Sông Vân Art space
        yaw: -0.5513
        pitch: 0.0406
        plugin: panel
        placement: horizontal
        contents:
          - id: h1791363976191-text
            type: text
            content: >-
              Sông Vân Art space…

              Không gian nghệ thuật cũng là tư gia của gia đình nghệ sỹ Lương Trịnh mang tên Lương gia Art space đã là
              nơi khởi động những hoạt động nghệ thuật điêu khắc đá đương đại từ năm 2018 với workshop đầu tiên mang tên
              ‘Về với đá’, năm 2021 workshop và triển lãm điêu khắc đá Biến Chuyển. Mong muốn mở rộng và tạo lập một
              không gian trưng bày hoàn chỉnh hơn. Vừa tìm đến sự mới mẻ, hoà đồng với không gian sống, vừa tạo nên sự
              hấp dẫn của một điểm đến giữa lòng làng nghề đá. Lương gia Art space đã quyết định đổi tên thành Sông Vân
              Art space.  Triển lãm của hai tác giả cũng là sự khai mở cho một không gian mới, một khát vọng tạo dựng
              không gian cho đá của Lương Trịnh.
            presentation: text-and-audio
            speech:
              src: /uploads/audio/1791561827926-i0facs307li.wav
