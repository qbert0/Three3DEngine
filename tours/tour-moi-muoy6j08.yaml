      - id: h1791474195474
        label: Xem nội dung
        yaw: 1.6709
        pitch: 0.0877
        plugin: panel
        placement: horizontal
        contents:
          - id: block-1791474202069
            type: image
            src: /uploads/1791475775090-vptl3sa6rd9-panel.webp
            alt: ''
            caption: ''
          - id: block-1791474209766
            type: text
            content: >-
              hòn đá triết gia. Tác phẩm điêu khắc đá cẩm thạch trắng với hình khối hình học tối giản, mạnh mẽ. Tảng đá
              được chế tác thành một khối đặc có dạng như một cánh cổng hoặc mái vòm cách điệu — phần trên là một khối
              hình thang vát chéo, tạo thành cạnh nghiêng sắc nét, trong khi phần dưới được khoét rỗng một khoảng hình
              chữ nhật đứng, tạo nên một "lối đi" hoặc khung cửa mở giữa hai trụ đá. Bề mặt đá trắng ngà với những vân
              xám tự nhiên chạy dọc, để lộ rõ chất liệu cẩm thạch nguyên khối. Ánh sáng ban ngày đổ xuống tạo nên sự
              tương phản rõ rệt giữa mặt phẳng sáng và các cạnh tối, làm nổi bật tính khối và góc cạnh của tác phẩm.
            presentation: text-and-audio
            speech:
              lang: vi-VN
              rate: 1
              pitch: 1
