<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sông Vân Studio — Admin</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0:#0b0d10; --bg-1:#14171c; --bg-2:#1b1f26; --bg-3:#232833;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.14);
  --text-1:#f5f7fa; --text-2:rgba(245,247,250,.72); --text-3:rgba(245,247,250,.45); --text-4:rgba(245,247,250,.28);
  --accent:#3b82f6; --accent-hover:#60a5fa; --accent-soft:rgba(59,130,246,.15);
  --video:#ef4444; --video-soft:rgba(239,68,68,.15);
  --model:#a855f7; --model-soft:rgba(168,85,247,.15);
  --success:#22c55e; --warning:#f59e0b; --danger:#ef4444;
  --brand:#2d6a4f; --brand-hover:#3a8562; --bronze:#a07828;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-full:999px;
  --shadow-md:0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:13.5px;line-height:1.5;color:var(--text-1);background:var(--bg-0);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
svg{display:block}

.studio{display:grid;grid-template-columns:320px 5px 1fr 5px 360px;grid-template-rows:60px 1fr;height:100vh;background:var(--bg-0)}
.topbar{grid-column:1/-1;grid-row:1}
.sidebar-left{grid-column:1;grid-row:2}
.resizer-left{grid-column:2;grid-row:2}
.canvas{grid-column:3;grid-row:2}
.resizer-right{grid-column:4;grid-row:2}
.sidebar-right{grid-column:5;grid-row:2}

.resizer{background:var(--bg-0);cursor:col-resize;position:relative;transition:background .15s}
.resizer::before{content:'';position:absolute;inset:0;margin:auto;width:1px;height:36px;background:var(--border-strong);border-radius:2px;transition:all .15s}
.resizer:hover{background:var(--accent-soft)}
.resizer:hover::before{background:var(--accent);height:60px}
.resizer.dragging{background:var(--accent-soft)}
.resizer.dragging::before{background:var(--accent);height:100%}

.topbar{display:flex;align-items:center;gap:20px;padding:0 20px;background:linear-gradient(180deg,var(--bg-2),var(--bg-1));border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;padding-right:20px;border-right:1px solid var(--border);height:40px}
.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,var(--brand),#1b4332);color:#fff;font-weight:700;font-size:13px;box-shadow:0 0 0 3px rgba(45,106,79,.15)}
.brand-text strong{display:block;font-size:14px;font-weight:600}
.brand-text span{display:block;font-size:11px;color:var(--text-3);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3)}
.breadcrumb svg{width:12px;height:12px;opacity:.4}
.breadcrumb strong{color:var(--text-1);font-weight:500}
.spacer{flex:1}
.save-status{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:var(--r-full);background:var(--bg-3);font-size:12px;color:var(--text-2);border:1px solid var(--border)}
.save-status .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.save-status.saving .dot{background:var(--warning);box-shadow:0 0 0 3px rgba(245,158,11,.18);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.topbar-actions{display:flex;align-items:center;gap:6px}
.divider{width:1px;height:22px;background:var(--border);margin:0 4px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;border:1px solid transparent;transition:all .15s var(--ease);white-space:nowrap;color:var(--text-2);background:transparent}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:var(--bg-3);border-color:var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--surface-hover);color:var(--text-1);border-color:var(--border-strong)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;box-shadow:0 2px 8px rgba(59,130,246,.35)}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);transform:translateY(-1px)}
.btn-accent{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.btn-accent:hover:not(:disabled){background:var(--brand-hover);border-color:var(--brand-hover);transform:translateY(-1px)}
.btn-placing{background:var(--warning);color:#1a1613;border-color:var(--warning);font-weight:700;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.7}}
.btn-danger{background:rgba(239,68,68,.12);color:#fca5a5;border-color:rgba(239,68,68,.3)}
.btn-danger:hover:not(:disabled){background:rgba(239,68,68,.22);color:#fff}
.btn-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--bg-3);border:1px solid var(--border);color:var(--text-2);transition:all .15s var(--ease)}
.btn-icon:hover:not(:disabled){background:var(--surface-hover);color:var(--text-1);border-color:var(--border-strong)}
.btn-icon:disabled{opacity:.35;cursor:not-allowed}
.btn-icon svg{width:16px;height:16px}
.btn-icon-sm{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--text-3);background:var(--bg-3);border:1px solid var(--border);transition:all .15s var(--ease)}
.btn-icon-sm:hover{background:var(--surface-hover);color:var(--text-1);border-color:var(--border-strong)}
.btn-icon-sm.accent{background:rgba(45,106,79,.2);color:#7ec8a0;border-color:rgba(45,106,79,.4)}
.btn-icon-sm.accent:hover{background:rgba(45,106,79,.35);color:#fff}
.btn-icon-sm svg{width:14px;height:14px}
.btn.full{width:100%;justify-content:center}

.sidebar{display:flex;flex-direction:column;overflow:hidden;background:var(--bg-1);min-width:0}
.sidebar-head{padding:18px 16px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sidebar-head h3{font-size:13px;font-weight:600}
.sidebar-head p{font-size:11.5px;color:var(--text-3)}
.sidebar-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.sidebar-body::-webkit-scrollbar{width:6px}
.sidebar-body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);flex-shrink:0}

.scene-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-md);cursor:pointer;transition:all .15s var(--ease);border:1px solid transparent;position:relative}
.scene-card:hover{background:var(--bg-3)}
.scene-card.active{background:linear-gradient(90deg,rgba(59,130,246,.14),rgba(59,130,246,.05));border-color:rgba(59,130,246,.4)}
.scene-card.active::before{content:'';position:absolute;left:-1px;top:20%;bottom:20%;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 12px rgba(59,130,246,.7)}
.drag-handle{color:var(--text-4);cursor:grab;flex-shrink:0;padding:0 2px}
.drag-handle svg{width:12px;height:12px}
.scene-thumb{position:relative;width:56px;height:40px;border-radius:var(--r-sm);overflow:hidden;flex-shrink:0;background:#000;border:1px solid var(--border)}
.scene-thumb img{width:100%;height:100%;object-fit:cover}
.thumb-num{position:absolute;top:3px;left:4px;font-size:9px;font-weight:700;font-family:'Courier New',monospace;color:#fff;background:rgba(0,0,0,.65);padding:1px 5px;border-radius:3px;backdrop-filter:blur(4px)}
.thumb-start{position:absolute;bottom:3px;right:3px;font-size:10px;color:var(--bronze);background:rgba(0,0,0,.7);padding:1px 5px;border-radius:3px}
.scene-info{flex:1;min-width:0}
.scene-info strong{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene-meta{display:block;font-size:10.5px;color:var(--text-3);margin-top:2px}

.canvas{display:flex;flex-direction:column;overflow:hidden;background:var(--bg-1)}
.canvas-toolbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.canvas-spacer{flex:1}
.canvas-hint{font-size:11.5px;color:var(--warning);font-weight:600;display:none}
.canvas-hint.on{display:block}

.canvas-stage{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a1e26 0%,#0a0c10 80%);cursor:default}
.canvas-stage.placing{cursor:crosshair}
.canvas-stage.placing .hotspot{pointer-events:none}

.canvas-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-3);font-size:13px}
.canvas-empty svg{width:48px;height:48px;opacity:.35;color:var(--accent)}
.canvas-image{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .3s;pointer-events:none}
.canvas-image::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 100%,rgba(0,0,0,.5),transparent 70%)}

.hotspot{position:absolute;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;transform:translate(-50%,-50%)}
.hotspot:active{cursor:grabbing}
.hotspot.dragging{z-index:100}
.hotspot-circle{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,rgba(59,130,246,.95),rgba(37,99,235,.9));border:2.5px solid rgba(255,255,255,.95);box-shadow:0 4px 24px rgba(59,130,246,.65),0 0 0 6px rgba(59,130,246,.2);display:grid;place-items:center;transition:all .15s}
.hotspot-circle svg{width:20px;height:20px;pointer-events:none}
.hotspot.info .hotspot-circle{background:linear-gradient(135deg,rgba(160,120,40,.95),rgba(160,120,40,.85));box-shadow:0 4px 24px rgba(160,120,40,.55),0 0 0 6px rgba(160,120,40,.18)}
.hotspot.video .hotspot-circle{background:linear-gradient(135deg,rgba(239,68,68,.95),rgba(220,38,38,.9));box-shadow:0 4px 24px rgba(239,68,68,.6),0 0 0 6px rgba(239,68,68,.2)}
.hotspot.model3d .hotspot-circle{background:linear-gradient(135deg,rgba(168,85,247,.95),rgba(147,51,234,.9));box-shadow:0 4px 24px rgba(168,85,247,.6),0 0 0 6px rgba(168,85,247,.2)}
.hotspot.selected .hotspot-circle{box-shadow:0 0 0 3px #c9a227,0 6px 32px rgba(201,162,39,.65)}
.hotspot:hover .hotspot-circle{transform:scale(1.08)}
.hotspot.dragging .hotspot-circle{box-shadow:0 0 0 4px #c9a227,0 8px 40px rgba(201,162,39,.8);transform:scale(1.12)}
.hotspot-label{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:#fff;background:rgba(10,12,16,.9);padding:4px 10px;border-radius:var(--r-full);white-space:nowrap;border:1px solid var(--border-strong);pointer-events:none}

.canvas-hud{position:absolute;bottom:16px;left:16px;right:16px;display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(10,12,16,.85);border:1px solid var(--border-strong);border-radius:var(--r-md);backdrop-filter:blur(16px);box-shadow:var(--shadow-lg);pointer-events:none;z-index:5}
.hud-badge{font-size:10.5px;font-family:'Courier New',monospace;font-weight:700;padding:4px 10px;background:var(--accent-soft);color:var(--accent-hover);border-radius:var(--r-full);border:1px solid rgba(59,130,246,.3);letter-spacing:.05em}
.canvas-hud strong{font-size:14px;font-weight:600;color:#fff}
.hud-sub{font-size:12px;color:var(--text-3);margin-left:auto}
.hud-coords{font-size:11px;font-family:'Courier New',monospace;color:var(--accent-hover);background:rgba(59,130,246,.12);padding:3px 8px;border-radius:var(--r-sm);border:1px solid rgba(59,130,246,.3);display:none}
.hud-coords.on{display:inline-block}

.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:14px 8px;font-size:12px;font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;transition:all .15s var(--ease);position:relative}
.tab svg{width:14px;height:14px}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--text-1);border-bottom-color:var(--accent)}
.tab-badge{font-size:10px;font-weight:700;padding:1px 6px;background:var(--accent);color:#fff;border-radius:var(--r-full);margin-left:2px}

.inspector-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:18px}
.inspector-body::-webkit-scrollbar{width:6px}
.inspector-body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}

.panel{display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-eyebrow{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text-4)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:500;color:var(--text-2)}
.field input[type=text],.field input[type=number],.field input[type=url],.field textarea,.field select{width:100%;padding:9px 12px;background:var(--bg-3);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text-1);font-size:13px;outline:none;transition:all .15s var(--ease)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);background:rgba(59,130,246,.06);box-shadow:0 0 0 3px rgba(59,130,246,.14)}
.field textarea{resize:vertical;min-height:70px;font-family:inherit;line-height:1.5}
.field select option{background:var(--bg-2)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:11px;color:var(--text-4);line-height:1.5;margin-top:2px}
.hint.warn{color:var(--warning)}

.image-picker{position:relative;width:100%;aspect-ratio:16/10;border-radius:var(--r-md);overflow:hidden;border:1.5px dashed var(--border-strong);background:var(--bg-3);cursor:pointer;transition:all .2s var(--ease)}
.image-picker:hover{border-color:var(--accent);background:rgba(59,130,246,.05)}
.image-picker img{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
.image-picker:hover img{transform:scale(1.03)}
.image-picker-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.75));color:#fff;opacity:0;transition:opacity .2s;font-size:12.5px;font-weight:500}
.image-picker:hover .image-picker-overlay{opacity:1}
.image-picker-overlay svg{width:24px;height:24px}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.toggle-row label{font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer}
.toggle-row .hint{margin-top:2px;font-size:11px}
.switch{position:relative;width:42px;height:24px;border-radius:var(--r-full);background:var(--bg-3);border:1px solid var(--border-strong);transition:all .25s var(--ease);flex-shrink:0;cursor:pointer}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:all .25s var(--ease);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.switch.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.switch.on::after{left:calc(100% - 20px)}

.hotspot-list{display:flex;flex-direction:column;gap:6px}
.hotspot-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-3);border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;transition:all .15s var(--ease)}
.hotspot-item:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.hotspot-item.selected{background:linear-gradient(90deg,rgba(59,130,246,.14),rgba(59,130,246,.04));border-color:rgba(59,130,246,.45)}
.hotspot-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.hotspot-icon.navigation{background:rgba(59,130,246,.2);color:var(--accent-hover)}
.hotspot-icon.info{background:rgba(160,120,40,.2);color:#e0b95c}
.hotspot-icon.video{background:var(--video-soft);color:#fca5a5}
.hotspot-icon.model3d{background:var(--model-soft);color:#d8b4fe}
.hotspot-icon svg{width:14px;height:14px}
.hotspot-info{flex:1;min-width:0}
.hotspot-info strong{display:block;font-size:12.5px;font-weight:500;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hotspot-info span{display:block;font-size:10.5px;color:var(--text-3);margin-top:1px}
.hotspot-delete{width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-4);transition:all .15s var(--ease)}
.hotspot-delete:hover{background:rgba(239,68,68,.18);color:#fca5a5}
.hotspot-delete svg{width:13px;height:13px}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;text-align:center;color:var(--text-3);font-size:12.5px}
.empty svg{width:40px;height:40px;opacity:.35;color:var(--accent)}
.danger-zone{padding-top:16px;border-top:1px solid var(--border)}
.divider-v{height:1px;background:var(--border);margin:4px 0}

/* ═══ MODAL ═══ */
.modal-backdrop{position:fixed;inset:0;background:rgba(5,7,10,.75);backdrop-filter:blur(8px);z-index:200;display:none;place-items:center;padding:20px;animation:fade-in .2s ease}
.modal-backdrop.open{display:grid}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-2);border:1px solid var(--border-strong);border-radius:var(--r-lg);max-width:720px;width:100%;box-shadow:var(--shadow-lg);overflow:hidden;animation:modal-in .3s var(--ease)}
@keyframes modal-in{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-eyebrow{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:4px}
.modal-head h3{font-size:16px;font-weight:600}
.modal-body{padding:22px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type-card{padding:20px 16px;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--bg-3);transition:all .2s var(--ease);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.type-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.type-card.nav:hover{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.06)}
.type-card.info:hover{border-color:rgba(160,120,40,.5);background:rgba(160,120,40,.06)}
.type-card.video:hover{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.06)}
.type-card.model3d:hover{border-color:rgba(168,85,247,.5);background:rgba(168,85,247,.06)}
.type-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin-bottom:4px}
.type-icon.nav{background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(37,99,235,.15));color:var(--accent-hover);border:1px solid rgba(59,130,246,.3)}
.type-icon.info{background:linear-gradient(135deg,rgba(160,120,40,.25),rgba(160,120,40,.1));color:#e0b95c;border:1px solid rgba(160,120,40,.3)}
.type-icon.video{background:linear-gradient(135deg,rgba(239,68,68,.25),rgba(239,68,68,.1));color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.type-icon.model3d{background:linear-gradient(135deg,rgba(168,85,247,.25),rgba(168,85,247,.1));color:#d8b4fe;border:1px solid rgba(168,85,247,.3)}
.type-icon svg{width:22px;height:22px}
.type-card strong{font-size:14px;font-weight:600}
.type-card span{font-size:11.5px;color:var(--text-3);line-height:1.4}
</style>
</head>
<body>

<div class="studio" id="studio">
  <header class="topbar" id="topbar-mount"></header>
  <aside class="sidebar sidebar-left" id="sidebar-left-mount"></aside>
  <div class="resizer resizer-left" data-resizer="left"></div>
  <main class="canvas" id="canvas-mount"></main>
  <div class="resizer resizer-right" data-resizer="right"></div>
  <aside class="sidebar sidebar-right" id="sidebar-right-mount"></aside>
</div>

<script>
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
var escapeAttr = escapeHtml;

// ═══════════════════════════════════════════════════════
// STORE
// ═══════════════════════════════════════════════════════
var store = {
  scenes: [
    {
      id: 'scene-c1', title: 'Sân Điêu Khắc Bên Sông',
      desc: 'Không gian trưng bày điêu khắc đá ngoài trời bên bờ sông Vân.',
      image: 'https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=75',
      enterTime: 0, enterEffect: 'fade', startScene: true,
      hotspots: [
        { id: 'h1', type: 'navigation', label: 'Đi đến Vườn Tượng', target: 'scene-c2', yaw: 1.24, pitch: 0.08 },
        { id: 'h-vid', type: 'video', label: 'Video giới thiệu', url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', yaw: -1.5, pitch: 0.15 },
        { id: 'h-3d', type: 'model3d', label: 'Tác phẩm "Sóng"', modelImage: 'https://images.unsplash.com/photo-1554188248-986adbb73be4?w=1200&q=80', content: 'Tác phẩm điêu khắc đá granite lấy cảm hứng từ những con sóng trên sông Vân. Được chế tác thủ công bởi nghệ nhân Ninh Vân trong 6 tháng.', yaw: 2.87, pitch: 0.12 }
      ]
    },
    {
      id: 'scene-c2', title: 'Vườn Tượng',
      desc: 'Khu vườn trưng bày các tác phẩm điêu khắc đá độc đáo.',
      image: 'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1600&q=75',
      enterTime: 1.5, enterEffect: 'zoom', startScene: false,
      hotspots: [
        { id: 'h2', type: 'info', label: 'Tác phẩm "Sóng"', content: 'Điêu khắc đá granite...', yaw: 2.87, pitch: 0.12 }
      ]
    },
    {
      id: 'scene-c3', title: 'Lối Dạo Nghệ Thuật',
      desc: 'Lối đi dạo ven sông với các tác phẩm hai bên.',
      image: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600&q=75',
      enterTime: 0, enterEffect: 'slide', startScene: false, hotspots: []
    },
    {
      id: 'scene-c4', title: 'Cổng Sông Vân Art Space',
      desc: 'Cổng chính dẫn vào khu art space.',
      image: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&q=75',
      enterTime: 0, enterEffect: 'fade', startScene: false, hotspots: []
    }
  ],

  activeSceneId: null, activeHotspotId: null, activeTab: 'scene',
  isDirty: false, placing: false,
  _listeners: new Set(),

  subscribe: function(fn) { this._listeners.add(fn); return () => this._listeners.delete(fn); },
  notify: function(event) {
    event = event || 'any';
    this._listeners.forEach(function(fn) { fn(event); });
  },
  init: function() {
    if (!this.activeSceneId && this.scenes.length > 0) {
      var start = this.scenes.find(function(s) { return s.startScene; }) || this.scenes[0];
      this.activeSceneId = start.id;
    }
    this.notify('init');
  },
  get activeScene() { return this.scenes.find(function(s) { return s.id === store.activeSceneId; }) || null; },
  get activeHotspot() {
    if (!this.activeScene || !this.activeHotspotId) return null;
    return this.activeScene.hotspots.find(function(h) { return h.id === store.activeHotspotId; }) || null;
  },
  selectScene: function(id) {
    if (this.activeSceneId === id) return;
    this.activeSceneId = id; this.activeHotspotId = null; this.placing = false;
    this.notify('activeScene');
  },
  selectHotspot: function(id) {
    this.activeHotspotId = this.activeHotspotId === id ? null : id;
    this.notify('activeHotspot');
  },
  setActiveTab: function(tab) { this.activeTab = tab; this.notify('tab'); },
  setPlacing: function(val) { this.placing = val; this.notify('placing'); },
  updateScene: function(field, value) {
    var scene = this.activeScene; if (!scene) return;
    scene[field] = value; this.isDirty = true; this.notify('sceneUpdated');
  },
  changeImage: function(file) {
    var scene = this.activeScene; if (!scene || !file) return;
    scene.image = URL.createObjectURL(file); this.isDirty = true; this.notify('sceneUpdated');
  },
  addScene: function() {
    var id = 'scene-' + Date.now();
    this.scenes.push({
      id: id, title: 'Cảnh mới', desc: '',
      image: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600&q=75',
      enterTime: 0, enterEffect: 'fade', startScene: false, hotspots: []
    });
    this.activeSceneId = id; this.activeHotspotId = null; this.placing = false;
    this.isDirty = true; this.notify('scenesList');
  },
  deleteScene: function(id) {
    if (this.scenes.length <= 1) return false;
    this.scenes = this.scenes.filter(function(s) { return s.id !== id; });
    if (this.activeSceneId === id) { this.activeSceneId = this.scenes[0].id; this.activeHotspotId = null; }
    this.isDirty = true; this.notify('scenesList');
    return true;
  },
  setStartScene: function(id) {
    this.scenes.forEach(function(s) { s.startScene = s.id === id; });
    this.isDirty = true; this.notify('scenesList');
  },
  addHotspotAt: function(type, yaw, pitch) {
    var scene = this.activeScene; if (!scene) return;
    var id = 'h-' + Date.now();
    var base = { id: id, yaw: yaw, pitch: pitch };
    var newHotspot;
    if (type === 'navigation') {
      var other = this.scenes.find(function(s) { return s.id !== scene.id; });
      newHotspot = Object.assign({}, base, { type: 'navigation', label: 'Đi đến cảnh khác', target: other ? other.id : '' });
    } else if (type === 'video') {
      newHotspot = Object.assign({}, base, { type: 'video', label: 'Video', url: '' });
    } else if (type === 'model3d') {
      newHotspot = Object.assign({}, base, { type: 'model3d', label: 'Mô hình 3D', modelImage: '', content: '' });
    } else {
      newHotspot = Object.assign({}, base, { type: 'info', label: 'Thông tin', content: '' });
    }
    scene.hotspots.push(newHotspot);
    this.activeHotspotId = id;
    this.isDirty = true; this.notify('hotspots');
  },
  updateHotspot: function(field, value) {
    var hs = this.activeHotspot; if (!hs) return;
    hs[field] = value; this.isDirty = true; this.notify('hotspots');
  },
  deleteHotspot: function(id) {
    var scene = this.activeScene; if (!scene) return;
    scene.hotspots = scene.hotspots.filter(function(h) { return h.id !== id; });
    if (this.activeHotspotId === id) this.activeHotspotId = null;
    this.isDirty = true; this.notify('hotspots');
  },
  save: function() { this.isDirty = false; this.notify('saved'); }
};

// ═══════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════
function renderCanvas(mount) {
  mount.innerHTML = ''
    + '<div class="canvas-toolbar">'
    +   '<button class="btn btn-accent" id="btn-add-hs">'
    +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
    +     '<span id="btn-add-hs-text">Đặt hotspot</span>'
    +   '</button>'
    +   '<div class="canvas-spacer"></div>'
    +   '<span class="canvas-hint" id="canvas-hint">💡 Click vào ảnh để đặt hotspot · ESC để hủy</span>'
    + '</div>'
    + '<div class="canvas-stage" id="stage"></div>';

  var stage = mount.querySelector('#stage');
  var btn = mount.querySelector('#btn-add-hs');
  var btnText = mount.querySelector('#btn-add-hs-text');
  var hint = mount.querySelector('#canvas-hint');

  btn.addEventListener('click', function() {
    if (!store.activeScene) { alert('Chọn một ảnh trước.'); return; }
    store.setPlacing(!store.placing);
  });

  stage.addEventListener('click', function(e) {
    if (!store.placing) return;
    if (e.target.closest('.hotspot')) return;
    var scene = store.activeScene; if (!scene) return;
    var rect = stage.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width;
    var y = (e.clientY - rect.top) / rect.height;
    var yaw = Math.max(-Math.PI, Math.min(Math.PI, (x - 0.5) * Math.PI * 2));
    var pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, (0.5 - y) * Math.PI));
    store.setPlacing(false);
    openHotspotModal(yaw, pitch);
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && store.placing) store.setPlacing(false);
  });

  function hsToPercent(h) {
    return { left: 50 + (h.yaw / Math.PI) * 50, top: 50 - (h.pitch / Math.PI) * 100 };
  }

  function hotspotIcon(type) {
    if (type === 'navigation') return '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v12M6 10l6-6 6 6"/></svg>';
    if (type === 'info') return '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="7" r="1.8" fill="white" stroke="none"/><path d="M12 11v7"/></svg>';
    if (type === 'video') return '<svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>';
    if (type === 'model3d') return '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg>';
    return '';
  }

  function renderStage() {
    var scene = store.activeScene;
    if (!scene) {
      stage.innerHTML = '<div class="canvas-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 9 6 6M15 9l-6 6"/></svg><p>Chọn một ảnh ở thanh bên trái để bắt đầu</p></div>';
      return;
    }

    var idx = store.scenes.findIndex(function(s) { return s.id === scene.id; });
    var hsHtml = '';
    scene.hotspots.forEach(function(h) {
      var pos = hsToPercent(h);
      var selected = h.id === store.activeHotspotId ? 'selected' : '';
      hsHtml += '<div class="hotspot ' + h.type + ' ' + selected + '" data-id="' + h.id + '" style="left:' + pos.left + '%;top:' + pos.top + '%">'
        + '<div class="hotspot-circle">' + hotspotIcon(h.type) + '</div>'
        + '<span class="hotspot-label">' + escapeHtml(h.label) + '</span>'
        + '</div>';
    });

    stage.innerHTML = '<div class="canvas-image" style="background-image:url(\'' + scene.image + '\')"></div>'
      + hsHtml
      + '<div class="canvas-hud">'
      +   '<span class="hud-badge">ẢNH ' + (idx + 1) + '/' + store.scenes.length + '</span>'
      +   '<strong>' + escapeHtml(scene.title) + '</strong>'
      +   '<span class="hud-coords" id="hud-coords"></span>'
      +   '<span class="hud-sub">' + scene.hotspots.length + ' hotspot</span>'
      + '</div>';

    bindHotspots();
  }

  function bindHotspots() {
    var coordsEl = document.getElementById('hud-coords');

    stage.querySelectorAll('.hotspot').forEach(function(el) {
      el.addEventListener('mousedown', function(e) {
        if (store.placing) return;
        if (e.button !== 0) return;
        e.preventDefault(); e.stopPropagation();

        var id = el.dataset.id;
        var scene = store.activeScene; if (!scene) return;
        if (store.activeHotspotId !== id) { store.activeHotspotId = id; store.notify('activeHotspot'); }

        var rect = stage.getBoundingClientRect();
        var startX = e.clientX, startY = e.clientY;
        var hs = scene.hotspots.find(function(h) { return h.id === id; });
        if (!hs) return;
        var startYaw = hs.yaw, startPitch = hs.pitch;

        el.classList.add('dragging');
        document.body.style.cursor = 'grabbing';
        document.body.style.userSelect = 'none';
        if (coordsEl) coordsEl.classList.add('on');

        function onMove(ev) {
          var dx = ev.clientX - startX, dy = ev.clientY - startY;
          var dYaw = (dx / rect.width) * Math.PI * 2;
          var dPitch = -(dy / rect.height) * Math.PI;
          var newYaw = Math.max(-Math.PI, Math.min(Math.PI, startYaw + dYaw));
          var newPitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, startPitch + dPitch));
          var pos = hsToPercent({ yaw: newYaw, pitch: newPitch });
          el.style.left = pos.left + '%'; el.style.top = pos.top + '%';
          el.dataset.tmpYaw = newYaw; el.dataset.tmpPitch = newPitch;
          if (coordsEl) coordsEl.textContent = 'yaw ' + newYaw.toFixed(2) + ' · pitch ' + newPitch.toFixed(2);
        }

        function onUp() {
          el.classList.remove('dragging');
          document.body.style.cursor = ''; document.body.style.userSelect = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          if (el.dataset.tmpYaw !== undefined) {
            hs.yaw = parseFloat(el.dataset.tmpYaw); hs.pitch = parseFloat(el.dataset.tmpPitch);
            delete el.dataset.tmpYaw; delete el.dataset.tmpPitch;
            store.isDirty = true; store.notify('hotspots');
          }
          if (coordsEl) coordsEl.classList.remove('on');
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      el.addEventListener('click', function(e) {
        if (store.placing) return;
        e.stopPropagation();
        store.selectHotspot(el.dataset.id);
        store.setActiveTab('hotspots');
      });
    });
  }

  store.subscribe(function(event) {
    if (event === 'placing') {
      stage.classList.toggle('placing', store.placing);
      btn.classList.toggle('btn-placing', store.placing);
      btnText.textContent = store.placing ? 'Đang đặt... (ESC)' : 'Đặt hotspot';
      hint.classList.toggle('on', store.placing);
    }
    if (['init','activeScene','sceneUpdated','hotspots','activeHotspot','scenesList'].indexOf(event) !== -1) {
      if (stage.querySelector('.hotspot.dragging')) return;
      renderStage();
    }
  });

  renderStage();
}
</script>
<script>

  function renderSceneTab(scene) {
    return ''
      + '<section class="panel">'

      +   '<div class="field"><label>Tên ảnh</label><input type="text" id="f-title" value="' + escapeAttr(scene.title) + '"></div>'

      +   '<div class="image-picker" id="img-picker">'
      +     '<img src="' + scene.image + '" alt="">'
      +     '<div class="image-picker-overlay">'
      +       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>'
      +       '<span>Nhấn để đổi ảnh</span>'
      +     '</div>'
      +   '</div>'
      +   '<input type="file" id="img-file" accept="image/*" style="display:none">'
      +   '<p class="hint">💡 Ảnh panorama nên có tỷ lệ 2:1.</p>'
      + '</section>'
      + '<section class="panel">'
      +   '<header class="panel-head"><span class="panel-eyebrow">Hiệu ứng khi vào</span></header>'
      +   '<div class="field-row">'
      +     '<div class="field"><label>Thời gian (giây)</label><input type="number" id="f-time" value="' + scene.enterTime + '" min="0" max="10" step="0.5"></div>'
      +     '<div class="field"><label>Hiệu ứng</label><select id="f-effect">'
      +       '<option value="fade" ' + (scene.enterEffect === 'fade' ? 'selected' : '') + '>Mờ dần</option>'
      +       '<option value="zoom" ' + (scene.enterEffect === 'zoom' ? 'selected' : '') + '>Phóng to</option>'
      +       '<option value="slide" ' + (scene.enterEffect === 'slide' ? 'selected' : '') + '>Trượt ngang</option>'
      +     '</select></div>'
      +   '</div>'
      + '</section>'
      + '<section class="panel">'
      +   '<header class="panel-head"><span class="panel-eyebrow">Vị trí trong tour</span></header>'
      +   '<div class="toggle-row">'
      +     '<div><label>Đặt làm ảnh bắt đầu</label><p class="hint">Ảnh hiển thị đầu tiên khi mở tour</p></div>'
      +     '<div class="switch ' + (scene.startScene ? 'on' : '') + '" id="sw-start"></div>'
      +   '</div>'
      + '</section>'
      + '<section class="panel danger-zone">'
      +   '<button class="btn btn-danger full" id="btn-delete-scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Xóa ảnh này</button>'
      + '</section>';
  }

  function renderHotspotsTab(scene) {
    var hs = scene.hotspots;
    var active = store.activeHotspot;

    var listHtml = '';
    if (hs.length === 0) {
      listHtml = '<div class="empty">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>'
        + '<p>Chưa có hotspot nào</p>'
        + '<button class="btn btn-accent" id="add-hs-empty">Đặt hotspot trên ảnh</button>'
        + '</div>';
    } else {
      listHtml = '<div class="hotspot-list">';
      hs.forEach(function(h) {
        var sel = h.id === store.activeHotspotId ? 'selected' : '';
        listHtml += '<div class="hotspot-item ' + sel + '" data-id="' + h.id + '">'
          + '<div class="hotspot-icon ' + h.type + '">' + hotspotIconSvg(h.type) + '</div>'
          + '<div class="hotspot-info"><strong>' + escapeHtml(h.label) + '</strong><span>' + hotspotTypeLabel(h.type) + ' · yaw ' + h.yaw.toFixed(2) + '</span></div>'
          + '<button class="hotspot-delete" data-delete="' + h.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>'
          + '</div>';
      });
      listHtml += '</div>';
    }

    var editHtml = '';
    if (active) {
      editHtml = '<div class="divider-v"></div>'
        + '<section class="panel">'
        +   '<header class="panel-head"><span class="panel-eyebrow">Chỉnh sửa hotspot · ' + hotspotTypeLabel(active.type) + '</span></header>'
        +   '<div class="field"><label>Nhãn hiển thị</label><input type="text" id="hs-label" value="' + escapeAttr(active.label) + '"></div>';

      // Form riêng theo từng loại
      if (active.type === 'navigation') {
        var opts = '';
        store.scenes.forEach(function(s) {
          if (s.id !== scene.id) opts += '<option value="' + s.id + '" ' + (s.id === active.target ? 'selected' : '') + '>' + escapeHtml(s.title) + '</option>';
        });
        editHtml += '<div class="field"><label>Ảnh đích</label><select id="hs-target">' + opts + '</select></div>';
      } else if (active.type === 'info') {
        editHtml += '<div class="field"><label>Nội dung</label><textarea id="hs-content" rows="4">' + escapeHtml(active.content || '') + '</textarea></div>';
      } else if (active.type === 'video') {
        editHtml += '<div class="field"><label>URL Video</label><input type="url" id="hs-url" placeholder="https://youtube.com/watch?v=... hoặc /video.mp4" value="' + escapeAttr(active.url || '') + '"></div>'
          + '<p class="hint">💡 Hỗ trợ: YouTube, Vimeo, file MP4 trực tiếp.</p>'
          + (active.url ? '<div class="field"><label>Xem trước</label><div style="aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;">' + videoPreviewHtml(active.url) + '</div></div>' : '');
      } else if (active.type === 'model3d') {
        editHtml += '<div class="field"><label>Ảnh 3D / Ảnh 360° của vật thể</label>'
          +   '<div class="image-picker" id="model-picker">'
          +     (active.modelImage ? '<img src="' + active.modelImage + '" alt="">' : '<div style="width:100%;height:100%;display:grid;place-items:center;color:var(--text-3);font-size:12px;">Chưa có ảnh</div>')
          +     '<div class="image-picker-overlay">'
          +       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg>'
          +       '<span>Nhấn để tải ảnh</span>'
          +     '</div>'
          +   '</div>'
          +   '<input type="file" id="model-file" accept="image/*" style="display:none">'
          + '</div>'
          + '<div class="field"><label>Mô tả chi tiết</label><textarea id="hs-content" rows="5" placeholder="Mô tả về tác phẩm, chất liệu, kích thước...">' + escapeHtml(active.content || '') + '</textarea></div>'
          + '<p class="hint">💡 Ảnh 3D có thể là ảnh chụp 360° của vật thể, hoặc ảnh render 3D. Sẽ hiển thị kèm mô tả khi người xem click.</p>';
      }

      editHtml += '<div class="field-row">'
        + '<div class="field"><label>Yaw (rad)</label><input type="number" id="hs-yaw" value="' + active.yaw.toFixed(2) + '" step="0.05"></div>'
        + '<div class="field"><label>Pitch (rad)</label><input type="number" id="hs-pitch" value="' + active.pitch.toFixed(2) + '" step="0.05"></div>'
        + '</div>'
        + '<p class="hint warn">💡 Kéo trực tiếp hotspot trên ảnh để đổi vị trí.</p>'
        + '</section>';
    }

    return '<section class="panel">'
      +   '<header class="panel-head"><span class="panel-eyebrow">Hotspot trong ảnh (' + hs.length + ')</span>'
      +     '<button class="btn-icon-sm accent" id="add-hs" title="Đặt hotspot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>'
      +   '</header>'
      +   listHtml
      + '</section>' + editHtml;
  }

  function videoPreviewHtml(url) {
    if (!url) return '';
    var yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]+)/);
    if (yt) return '<iframe src="https://www.youtube.com/embed/' + yt[1] + '" style="width:100%;height:100%;border:0;" allowfullscreen></iframe>';
    var vm = url.match(/vimeo\.com\/(\d+)/);
    if (vm) return '<iframe src="https://player.vimeo.com/video/' + vm[1] + '" style="width:100%;height:100%;border:0;" allowfullscreen></iframe>';
    return '<video src="' + url + '" controls style="width:100%;height:100%;"></video>';
  }

  function bindSceneTab() {
    var scene = store.activeScene; if (!scene) return;
    var fTitle = document.getElementById('f-title');
    var fDesc = document.getElementById('f-desc');
    var fTime = document.getElementById('f-time');
    var fEffect = document.getElementById('f-effect');

    if (fTitle) fTitle.addEventListener('input', function(e) { store.updateScene('title', e.target.value); });
    if (fDesc) fDesc.addEventListener('input', function(e) { store.updateScene('desc', e.target.value); });
    if (fTime) fTime.addEventListener('input', function(e) { store.updateScene('enterTime', parseFloat(e.target.value) || 0); });
    if (fEffect) fEffect.addEventListener('change', function(e) { store.updateScene('enterEffect', e.target.value); });

    var picker = document.getElementById('img-picker');
    var fileInput = document.getElementById('img-file');
    if (picker && fileInput) {
      picker.addEventListener('click', function() { fileInput.click(); });
      fileInput.addEventListener('change', function(e) {
        var file = e.target.files && e.target.files[0];
        if (file) store.changeImage(file);
        e.target.value = '';
      });
    }
    var swStart = document.getElementById('sw-start');
    if (swStart) swStart.addEventListener('click', function() { store.setStartScene(scene.id); });

    var btnDel = document.getElementById('btn-delete-scene');
    if (btnDel) btnDel.addEventListener('click', function() {
      if (store.scenes.length <= 1) { alert('Không thể xóa ảnh cuối cùng.'); return; }
      if (confirm('Xóa ảnh "' + scene.title + '"?')) store.deleteScene(scene.id);
    });
  }

  function bindHotspotsTab() {
    var addBtn = document.getElementById('add-hs');
    var addEmpty = document.getElementById('add-hs-empty');
    if (addBtn) addBtn.addEventListener('click', function() { store.setPlacing(true); });
    if (addEmpty) addEmpty.addEventListener('click', function() { store.setPlacing(true); });

    document.querySelectorAll('.hotspot-item').forEach(function(item) {
      item.addEventListener('click', function(e) {
        if (e.target.closest('.hotspot-delete')) return;
        store.selectHotspot(item.dataset.id);
      });
    });
    document.querySelectorAll('.hotspot-delete').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        store.deleteHotspot(btn.dataset.delete);
      });
    });

    var active = store.activeHotspot;
    if (!active) return;

    var map = {
      'hs-label': 'label', 'hs-target': 'target', 'hs-content': 'content',
      'hs-url': 'url', 'hs-yaw': 'yaw', 'hs-pitch': 'pitch'
    };
    Object.keys(map).forEach(function(id) {
      var el = document.getElementById(id);
      if (!el) return;
      var field = map[id];
      var evt = (el.tagName === 'SELECT') ? 'change' : 'input';
      el.addEventListener(evt, function(e) {
        var v = e.target.value;
        if (field === 'yaw' || field === 'pitch') v = parseFloat(v) || 0;
        store.updateHotspot(field, v);
      });
    });

    // Model3D: upload ảnh
    var modelPicker = document.getElementById('model-picker');
    var modelFile = document.getElementById('model-file');
    if (modelPicker && modelFile) {
      modelPicker.addEventListener('click', function() { modelFile.click(); });
      modelFile.addEventListener('change', function(e) {
        var file = e.target.files && e.target.files[0];
        if (file) {
          var url = URL.createObjectURL(file);
          store.updateHotspot('modelImage', url);
        }
        e.target.value = '';
      });
    }
  }

  function renderBody() {
    var scene = store.activeScene;
    if (!scene) {
      body.innerHTML = '<div class="empty">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 9 6 6M15 9l-6 6"/></svg>'
        + '<p>Chọn một ảnh để chỉnh sửa</p></div>';
      return;
    }
    if (store.activeTab === 'scene') {
      body.innerHTML = renderSceneTab(scene);
      bindSceneTab();
    } else {
      body.innerHTML = renderHotspotsTab(scene);
      bindHotspotsTab();
    }
  }

  store.subscribe(function(event) {
    if (event === 'tab') setTabUI();
    if (['init','activeScene','sceneUpdated','hotspots','activeHotspot','tab','scenesList'].indexOf(event) !== -1) {
      var s = store.activeScene;
      badge.textContent = s ? s.hotspots.length : 0;
      renderBody();
    }
  });
  setTabUI();
  renderBody();
}

// ═══════════════════════════════════════════════════════
// MODAL — 4 loại hotspot
// ═══════════════════════════════════════════════════════
var _modalEl = null;
var _pendingCoords = null;

function renderModal(mount) {
  mount.innerHTML = ''
    + '<div class="modal-backdrop" id="modal">'
    +   '<div class="modal">'
    +     '<div class="modal-head">'
    +       '<div><span class="modal-eyebrow">Bước 2 / 2</span><h3>Chọn loại hotspot</h3></div>'
    +       '<button class="btn-icon-sm" id="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>'
    +     '</div>'
    +     '<div class="modal-body">'
    +       '<div class="type-grid">'
    +         '<button class="type-card nav" data-type="navigation">'
    +           '<div class="type-icon nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v14M6 11l6-6 6 6"/></svg></div>'
    +           '<strong>Di chuyển</strong><span>Dẫn đến cảnh panorama khác</span>'
    +         '</button>'
    +         '<button class="type-card info" data-type="info">'
    +           '<div class="type-icon info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="7" r="1.8" fill="currentColor" stroke="none"/><path d="M12 11v7"/></svg></div>'
    +           '<strong>Thông tin</strong><span>Panel văn bản đơn giản</span>'
    +         '</button>'
    +         '<button class="type-card video" data-type="video">'
    +           '<div class="type-icon video"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>'
    +           '<strong>Video</strong><span>Nhúng YouTube / Vimeo / MP4</span>'
    +         '</button>'
    +         '<button class="type-card model3d" data-type="model3d">'
    +           '<div class="type-icon model3d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 22V12M3 7l9 5 9-5"/></svg></div>'
    +           '<strong>Mô hình 3D</strong><span>Ảnh 3D + mô tả tác phẩm</span>'
    +         '</button>'
    +       '</div>'
    +     '</div>'
    +   '</div>'
    + '</div>';

  _modalEl = mount.querySelector('#modal');
  _modalEl.addEventListener('click', function(e) { if (e.target === _modalEl) closeModal(); });
  mount.querySelector('#modal-close').addEventListener('click', function() { closeModal(); });

  mount.querySelectorAll('.type-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var coords = _pendingCoords || { yaw: 0, pitch: 0 };
      store.addHotspotAt(card.dataset.type, coords.yaw, coords.pitch);
      store.setActiveTab('hotspots');
      closeModal();
    });
  });

  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
}

function openHotspotModal(yaw, pitch) {
  if (!store.activeScene) { alert('Chọn một ảnh trước.'); return; }
  _pendingCoords = (typeof yaw === 'number') ? { yaw: yaw, pitch: pitch } : null;
  if (_modalEl) _modalEl.classList.add('open');
}
function closeModal() { if (_modalEl) _modalEl.classList.remove('open'); }

// ═══════════════════════════════════════════════════════
// RESIZER
// ═══════════════════════════════════════════════════════
function initResizers() {
  var MIN = 200, MAX = 520;
  var studio = document.getElementById('studio');
  var savedLeft  = parseInt(localStorage.getItem('sv-sidebar-left')  || '320', 10);
  var savedRight = parseInt(localStorage.getItem('sv-sidebar-right') || '360', 10);
  applyWidths(savedLeft, savedRight);

  document.querySelectorAll('.resizer').forEach(function(r) {
    r.addEventListener('mousedown', function(e) { startDrag(e, r); });
  });

  function applyWidths(l, r) { studio.style.gridTemplateColumns = l + 'px 5px 1fr 5px ' + r + 'px'; }

  function startDrag(e, resizer) {
    e.preventDefault();
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
    var side = resizer.dataset.resizer;
    var startX = e.clientX;
    var c = getComputedStyle(studio).gridTemplateColumns.split(' ');
    var startLeft = parseInt(c[0], 10), startRight = parseInt(c[4], 10);

    function onMove(ev) {
      var dx = ev.clientX - startX;
      var nl = startLeft, nr = startRight;
      if (side === 'left') nl = clamp(startLeft + dx, MIN, MAX);
      else nr = clamp(startRight - dx, MIN, MAX);
      applyWidths(nl, nr);
    }
    function onUp() {
      resizer.classList.remove('dragging');
      document.body.style.cursor = ''; document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      var c2 = getComputedStyle(studio).gridTemplateColumns.split(' ');
      localStorage.setItem('sv-sidebar-left',  parseInt(c2[0], 10));
      localStorage.setItem('sv-sidebar-right', parseInt(c2[4], 10));
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
}

// ═══════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════
(function() {
  renderHeader(document.getElementById('topbar-mount'));
  renderSidebarLeft(document.getElementById('sidebar-left-mount'));
  renderCanvas(document.getElementById('canvas-mount'));
  renderSidebarRight(document.getElementById('sidebar-right-mount'));
  renderModal(document.getElementById('modal-mount'));
  initResizers();
  store.init();
})();
