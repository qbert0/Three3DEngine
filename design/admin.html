<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Tùy chỉnh Tour 360° — Trảng Bay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-0: #0a0a0a;
            --bg-1: #141414;
            --bg-2: #1c1c1c;
            --bg-3: #242424;
            --line: rgba(255, 255, 255, 0.08);
            --line-strong: rgba(255, 255, 255, 0.16);

            --text-1: #ffffff;
            --text-2: rgba(255, 255, 255, 0.68);
            --text-3: rgba(255, 255, 255, 0.42);
            --text-4: rgba(255, 255, 255, 0.25);

            --river: #1f6f8b;
            --river-2: #2d8fb0;
            --clay: #a8583f;
            --bronze: #c9a227;
            --green: #22c55e;
            --red: #ef4444;

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;

            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.55);

            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
            background: var(--bg-0);
            color: var(--text-1);
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }

        input,
        textarea,
        select {
            font-family: inherit;
        }

        /* ═══ ROOT LAYOUT ═══ */
        .admin {
            display: grid;
            grid-template-columns: 300px 1fr 340px;
            grid-template-rows: 56px 1fr;
            height: 100vh;
            gap: 1px;
            background: var(--line);
        }

        .admin>* {
            background: var(--bg-1);
        }

        /* ═══ TOPBAR ═══ */
        .topbar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 16px;
            background: var(--bg-1) !important;
        }

        .tb-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-right: 16px;
            border-right: 1px solid var(--line);
            height: 32px;
        }

        .tb-logo-mark {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--river), #155d75);
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 0 0 3px rgba(31, 111, 139, 0.15);
        }

        .tb-logo-text {
            font-size: 13px;
            line-height: 1.2;
        }

        .tb-logo-text strong {
            display: block;
            font-weight: 600;
        }

        .tb-logo-text span {
            color: var(--text-3);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .tb-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-3);
        }

        .tb-breadcrumb strong {
            color: var(--text-1);
            font-weight: 500;
        }

        .tb-breadcrumb svg {
            width: 12px;
            height: 12px;
            opacity: 0.4;
        }

        .tb-spacer {
            flex: 1;
        }

        .tb-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .tb-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            padding: 0 12px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            color: var(--text-2);
            font-size: 12px;
            font-weight: 500;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .tb-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-1);
            border-color: var(--line-strong);
        }

        .tb-btn svg {
            width: 14px;
            height: 14px;
        }

        .tb-btn.primary {
            background: var(--river);
            border-color: var(--river);
            color: #fff;
        }

        .tb-btn.primary:hover {
            background: var(--river-2);
            border-color: var(--river-2);
        }

        .tb-btn.icon-only {
            padding: 0;
            width: 32px;
            justify-content: center;
        }

        .tb-btn.danger {
            color: #fca5a5;
        }

        .tb-btn.danger:hover {
            background: rgba(239, 68, 68, 0.12);
            color: #fff;
            border-color: rgba(239, 68, 68, 0.4);
        }

        .save-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-3);
            padding: 0 12px;
        }

        .save-indicator .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
        }

        .save-indicator.saving .dot {
            background: var(--bronze);
            animation: pulse 1s infinite;
        }

        .save-indicator.dirty .dot {
            background: var(--clay);
        }

        @keyframes pulse {
            50% {
                opacity: 0.4;
            }
        }

        /* ═══ SIDEBAR TRÁI — SCENE LIST ═══ */
        .sidebar-left {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .side-head {
            padding: 16px;
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }

        .side-head-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .side-head h3 {
            font-size: 13px;
            font-weight: 600;
        }

        .side-head p {
            font-size: 11px;
            color: var(--text-3);
        }

        .side-add {
            width: 26px;
            height: 26px;
            border-radius: var(--radius-sm);
            background: rgba(31, 111, 139, 0.2);
            border: 1px solid rgba(31, 111, 139, 0.35);
            color: #7ec8e3;
            display: grid;
            place-items: center;
            transition: all 0.15s;
        }

        .side-add:hover {
            background: rgba(31, 111, 139, 0.35);
            color: #fff;
        }

        .side-add svg {
            width: 14px;
            height: 14px;
        }

        .scene-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .scene-list::-webkit-scrollbar {
            width: 6px;
        }

        .scene-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .scene-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
            position: relative;
        }

        .scene-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .scene-item.active {
            background: rgba(31, 111, 139, 0.14);
            border-color: rgba(31, 111, 139, 0.4);
        }

        .scene-item.active::before {
            content: '';
            position: absolute;
            left: -1px;
            top: 20%;
            bottom: 20%;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: var(--river);
        }

        .scene-item.dragging {
            opacity: 0.4;
        }

        .scene-item.drag-over {
            border-top: 2px solid var(--river);
        }

        .scene-drag {
            cursor: grab;
            color: var(--text-4);
            padding: 0 2px;
            flex-shrink: 0;
        }

        .scene-drag:active {
            cursor: grabbing;
        }

        .scene-drag svg {
            width: 12px;
            height: 12px;
        }

        .scene-thumb-sm {
            width: 44px;
            height: 30px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
            background: #000;
            border: 1px solid var(--line);
        }

        .scene-info {
            flex: 1;
            min-width: 0;
        }

        .scene-info strong {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .scene-info span {
            display: block;
            font-size: 10px;
            color: var(--text-3);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 2px;
        }

        .scene-badge {
            font-size: 9px;
            padding: 1px 6px;
            border-radius: 999px;
            background: rgba(201, 162, 39, 0.2);
            color: var(--bronze);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* ═══ CENTER — PREVIEW ═══ */
        .preview {
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--line);
            background: var(--bg-1);
            flex-shrink: 0;
        }

        .pt-tabs {
            display: flex;
            gap: 2px;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px;
            border-radius: var(--radius-sm);
        }

        .pt-tab {
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-3);
            transition: all 0.15s;
        }

        .pt-tab.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-1);
        }

        .pt-tab:hover:not(.active) {
            color: var(--text-2);
        }

        .pt-spacer {
            flex: 1;
        }

        .pt-zoom {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
        }

        .pt-zoom button {
            width: 26px;
            height: 26px;
            border-radius: 5px;
            color: var(--text-3);
            display: grid;
            place-items: center;
            transition: all 0.15s;
        }

        .pt-zoom button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-1);
        }

        .pt-zoom svg {
            width: 14px;
            height: 14px;
        }

        .pt-zoom-label {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-3);
            padding: 0 6px;
            min-width: 42px;
            text-align: center;
        }

        /* Preview canvas */
        .preview-canvas {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            cursor: crosshair;
        }

        .preview-canvas.mode-drag {
            cursor: grab;
        }

        .preview-canvas.mode-drag:active {
            cursor: grabbing;
        }

        .preview-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 0.4s var(--ease);
        }

        .preview-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.4) 100%);
        }

        /* Edit hotspots in preview */
        .edit-hotspot {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 5;
            cursor: move;
            user-select: none;
        }

        .edit-hotspot .hs-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(31, 111, 139, 0.9);
            border: 2.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 24px rgba(31, 111, 139, 0.6), 0 0 0 6px rgba(31, 111, 139, 0.2);
            display: grid;
            place-items: center;
            transition: box-shadow 0.15s;
        }

        .edit-hotspot:hover .hs-circle {
            box-shadow: 0 6px 32px rgba(31, 111, 139, 0.85), 0 0 0 10px rgba(31, 111, 139, 0.28);
        }

        .edit-hotspot.selected .hs-circle {
            box-shadow: 0 0 0 3px var(--bronze), 0 6px 32px rgba(201, 162, 39, 0.6);
        }

        .edit-hotspot .hs-circle svg {
            width: 20px;
            height: 20px;
        }

        .edit-hotspot.info .hs-circle {
            background: rgba(168, 88, 63, 0.9);
            width: 40px;
            height: 40px;
            box-shadow: 0 4px 20px rgba(168, 88, 63, 0.55), 0 0 0 6px rgba(168, 88, 63, 0.18);
        }

        .edit-hotspot.info .hs-circle svg {
            width: 18px;
            height: 18px;
        }

        .edit-hotspot.info.selected .hs-circle {
            box-shadow: 0 0 0 3px var(--bronze), 0 4px 20px rgba(168, 88, 63, 0.7);
        }

        .edit-hotspot .hs-label {
            position: absolute;
            top: calc(100% + 4px);
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            background: rgba(10, 10, 10, 0.78);
            padding: 3px 8px;
            border-radius: 999px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        /* Preview bottom info */
        .preview-info {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-md);
            backdrop-filter: blur(14px);
            z-index: 6;
        }

        .preview-info-badge {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            padding: 3px 8px;
            background: rgba(31, 111, 139, 0.3);
            color: #7ec8e3;
            border-radius: 999px;
            font-weight: 600;
        }

        .preview-info-title {
            font-size: 13px;
            font-weight: 600;
            flex: 1;
        }

        .preview-info-coord {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-3);
        }

        /* Hint overlay for hotspot placement */
        .place-hint {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            background: rgba(201, 162, 39, 0.95);
            color: #1a1613;
            font-size: 12px;
            font-weight: 600;
            border-radius: 999px;
            z-index: 10;
            display: none;
            box-shadow: 0 8px 24px rgba(201, 162, 39, 0.4);
            animation: hint-pulse 1.5s infinite;
        }

        .place-hint.active {
            display: block;
        }

        @keyframes hint-pulse {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
            }

            50% {
                transform: translateX(-50%) scale(1.03);
            }
        }

        /* ═══ SIDEBAR PHẢI — INSPECTOR ═══ */
        .inspector {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-1) !important;
        }

        .insp-tabs {
            display: flex;
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
            background: var(--bg-1);
        }

        .insp-tab {
            flex: 1;
            padding: 14px 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-3);
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            position: relative;
        }

        .insp-tab:hover {
            color: var(--text-2);
        }

        .insp-tab.active {
            color: var(--text-1);
            border-bottom-color: var(--river);
        }

        .insp-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .insp-body::-webkit-scrollbar {
            width: 6px;
        }

        .insp-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .insp-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .insp-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-4);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 12px;
            color: var(--text-2);
            font-weight: 500;
        }

        .field input[type="text"],
        .field input[type="number"],
        .field textarea,
        .field select {
            width: 100%;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            color: var(--text-1);
            font-size: 13px;
            outline: none;
            transition: all 0.15s;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: var(--river);
            background: rgba(31, 111, 139, 0.08);
            box-shadow: 0 0 0 3px rgba(31, 111, 139, 0.15);
        }

        .field textarea {
            resize: vertical;
            min-height: 70px;
            font-family: inherit;
        }

        .field select {
            cursor: pointer;
        }

        .field select option {
            background: var(--bg-2);
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .hint-text {
            font-size: 11px;
            color: var(--text-4);
            line-height: 1.5;
        }

        /* Image picker */
        .img-picker {
            position: relative;
            width: 100%;
            aspect-ratio: 16/10;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px dashed var(--line-strong);
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.15s;
        }

        .img-picker:hover {
            border-color: var(--river);
            background: rgba(31, 111, 139, 0.06);
        }

        .img-picker img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .img-picker-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            opacity: 0;
            transition: opacity 0.15s;
            font-size: 12px;
        }

        .img-picker:hover .img-picker-overlay {
            opacity: 1;
        }

        .img-picker-overlay svg {
            width: 20px;
            height: 20px;
        }

        /* Hotspot list */
        .hotspot-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hotspot-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s;
            font-size: 12px;
        }

        .hotspot-row:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--line-strong);
        }

        .hotspot-row.selected {
            background: rgba(31, 111, 139, 0.14);
            border-color: rgba(31, 111, 139, 0.4);
        }

        .hotspot-row-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .hotspot-row-icon.nav {
            background: rgba(31, 111, 139, 0.25);
            color: #7ec8e3;
        }

        .hotspot-row-icon.info {
            background: rgba(168, 88, 63, 0.25);
            color: #e0a58b;
        }

        .hotspot-row-icon svg {
            width: 12px;
            height: 12px;
        }

        .hotspot-row-name {
            flex: 1;
            font-weight: 500;
        }

        .hotspot-row-delete {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            color: var(--text-4);
            display: grid;
            place-items: center;
            transition: all 0.15s;
        }

        .hotspot-row-delete:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .hotspot-row-delete svg {
            width: 12px;
            height: 12px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 24px 16px;
            color: var(--text-4);
            font-size: 12px;
            line-height: 1.6;
        }

        .empty-state svg {
            width: 32px;
            height: 32px;
            margin: 0 auto 8px;
            opacity: 0.3;
        }

        /* Buttons */
        .btn-block {
            width: 100%;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            color: var(--text-2);
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s;
        }

        .btn-block:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-1);
            border-color: var(--line-strong);
        }

        .btn-block svg {
            width: 14px;
            height: 14px;
        }

        .btn-block.primary {
            background: rgba(31, 111, 139, 0.2);
            border-color: rgba(31, 111, 139, 0.4);
            color: #7ec8e3;
        }

        .btn-block.primary:hover {
            background: rgba(31, 111, 139, 0.35);
            color: #fff;
        }

        .btn-block.danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .btn-block.danger:hover {
            background: rgba(239, 68, 68, 0.22);
            color: #fff;
        }

        /* Toggle switch */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            cursor: pointer;
        }

        .toggle-row label {
            font-size: 12.5px;
            color: var(--text-2);
            cursor: pointer;
        }

        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.25s var(--ease);
        }

        .toggle.on {
            background: var(--river);
        }

        .toggle.on::after {
            transform: translateX(16px);
        }

        /* ═══ PREVIEW MODE — ẩn admin UI ═══ */
        body.preview-mode .sidebar-left,
        body.preview-mode .inspector,
        body.preview-mode .preview-toolbar {
            display: none;
        }

        body.preview-mode .admin {
            grid-template-columns: 1fr;
            grid-template-rows: 56px 1fr;
        }

        body.preview-mode .topbar {
            grid-column: 1;
        }

        body.preview-mode .preview {
            grid-column: 1;
        }

        /* ═══ TOAST ═══ */
        .toast-wrap {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            padding: 10px 18px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow-md);
            animation: toast-in 0.3s var(--ease);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.success {
            border-color: rgba(34, 197, 94, 0.4);
        }

        .toast.success svg {
            color: var(--green);
        }

        .toast svg {
            width: 14px;
            height: 14px;
        }

        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ═══ MODAL ═══ */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            background: var(--bg-2);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-lg);
            max-width: 480px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .modal-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-head h3 {
            font-size: 15px;
            font-weight: 600;
        }

        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-foot {
            padding: 14px 20px;
            border-top: 1px solid var(--line);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-close {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: var(--text-3);
            display: grid;
            place-items: center;
            transition: all 0.15s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .modal-close svg {
            width: 14px;
            height: 14px;
        }

        /* Hotspot type picker */
        .type-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .type-card {
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--line);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }

        .type-card:hover {
            border-color: var(--line-strong);
            background: rgba(255, 255, 255, 0.06);
        }

        .type-card.selected {
            border-color: var(--river);
            background: rgba(31, 111, 139, 0.15);
            box-shadow: 0 0 0 3px rgba(31, 111, 139, 0.15);
        }

        .type-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: grid;
            place-items: center;
        }

        .type-card-icon.nav {
            background: rgba(31, 111, 139, 0.3);
            color: #7ec8e3;
        }

        .type-card-icon.info {
            background: rgba(168, 88, 63, 0.3);
            color: #e0a58b;
        }

        .type-card-icon svg {
            width: 20px;
            height: 20px;
        }

        .type-card strong {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .type-card span {
            font-size: 11px;
            color: var(--text-3);
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <script>
        /* ═══════════════════════════════════════════════════════════
           DATA — Trong thực tế load từ API
           ═══════════════════════════════════════════════════════════ */
        const state = {
            tourName: 'Trảng Bay',
            scenes: [
                { id: 's1', name: 'Đỉnh Nhìn Ra Thung Lũng', img: 'https://picsum.photos/id/1015/2400/1200', thumb: 'https://picsum.photos/id/1015/200/120', desc: 'Tầm nhìn toàn cảnh thung lũng', hotspots: [] },
                { id: 's2', name: 'Rìa Rừng Thưa', img: 'https://picsum.photos/id/1016/2400/1200', thumb: 'https://picsum.photos/id/1016/200/120', desc: 'Vùng đệm giữa rừng và trảng', hotspots: [] },
                { id: 's3', name: 'Lối Mòn Giữa Trảng', img: 'https://picsum.photos/id/1018/2400/1200', thumb: 'https://picsum.photos/id/1018/200/120', desc: 'Lối đi xuyên qua đồng cỏ', hotspots: [] },
                { id: 's4', name: 'Bãi Cỏ Thoáng Đãng', img: 'https://picsum.photos/id/1019/2400/1200', thumb: 'https://picsum.photos/id/1019/200/120', desc: 'Bãi cỏ rộng, thoáng đãng', hotspots: [] },
                { id: 's5', name: 'Góc Nhìn Phía Núi', img: 'https://picsum.photos/id/1021/2400/1200', thumb: 'https://picsum.photos/id/1021/200/120', desc: 'Hướng nhìn về dãy núi', hotspots: [] },
                { id: 's6', name: 'Vùng Cây Bụi Thấp', img: 'https://picsum.photos/id/1022/2400/1200', thumb: 'https://picsum.photos/id/1022/200/120', desc: 'Thảm thực vật thấp', hotspots: [] },
                {
                    id: 's7', name: 'Điểm Hợp Lưu', img: 'https://picsum.photos/id/1015/2400/1200', thumb: 'https://picsum.photos/id/1015/200/120', desc: 'Nơi ba hướng đi gặp nhau',
                    hotspots: [
                        { id: 'h1', type: 'nav', x: 30, y: 42, label: 'Điểm Hợp Lưu', target: 's7' },
                        { id: 'h2', type: 'nav', x: 68, y: 58, label: 'Cổng Vào Trảng Bay', target: 's8' },
                        { id: 'h3', type: 'info', x: 48, y: 70, label: 'Thông tin', target: null }
                    ]
                },
                { id: 's8', name: 'Cổng Vào Trảng Bay 1', img: 'https://picsum.photos/id/1036/2400/1200', thumb: 'https://picsum.photos/id/1036/200/120', desc: 'Cổng vào khu vực Trảng Bay 1', hotspots: [] },
                { id: 's9', name: 'Đồng Trảng Rộng', img: 'https://picsum.photos/id/1039/2400/1200', thumb: 'https://picsum.photos/id/1039/200/120', desc: 'Đồng trảng rộng lớn', hotspots: [] },
                { id: 's10', name: 'Góc Phía Đông Trảng', img: 'https://picsum.photos/id/1040/2400/1200', thumb: 'https://picsum.photos/id/1040/200/120', desc: 'Góc nhìn về phía Đông', hotspots: [] },
                { id: 's11', name: 'Trung Tâm Trảng Bay 1', img: 'https://picsum.photos/id/1043/2400/1200', thumb: 'https://picsum.photos/id/1043/200/120', desc: 'Trung tâm Trảng Bay 1', hotspots: [] },
                { id: 's12', name: 'Biên Giới Hai Trảng', img: 'https://picsum.photos/id/1044/2400/1200', thumb: 'https://picsum.photos/id/1044/200/120', desc: 'Ranh giới giữa 2 trảng', hotspots: [] },
                { id: 's13', name: 'Cổng Vào Trảng Bay 2', img: 'https://picsum.photos/id/1048/2400/1200', thumb: 'https://picsum.photos/id/1048/200/120', desc: 'Cổng vào khu vực Trảng Bay 2', hotspots: [] },
                { id: 's14', name: 'Vùng Cỏ Lau Cao', img: 'https://picsum.photos/id/1050/2400/1200', thumb: 'https://picsum.photos/id/1050/200/120', desc: 'Vùng cỏ lau cao', hotspots: [] },
                { id: 's15', name: 'Bờ Rừng Phía Tây', img: 'https://picsum.photos/id/1055/2400/1200', thumb: 'https://picsum.photos/id/1055/200/120', desc: 'Bờ rừng phía Tây', hotspots: [] },
                { id: 's16', name: 'Cuối Trảng Bay 2', img: 'https://picsum.photos/id/1062/2400/1200', thumb: 'https://picsum.photos/id/1062/200/120', desc: 'Cuối Trảng Bay 2', hotspots: [] }
            ],
            settings: {
                startSceneId: 's7',
                mode: 'free', // 'free' | 'guided'
                guidedDuration: 8,
                autoRotate: false,
                showMinimap: true
            }
        };

        let currentSceneIdx = 6; // Điểm Hợp Lưu
        let selectedHotspotId = null;
        let currentTab = 'scene';
        let isPlacingHotspot = false;
        let pendingHotspotPos = null;
        let isDirty = false;
        let previewMode = false;
        let zoom = 100;
        let dragState = { active: false, startX: 0, bgX: 0 };

        /* ═══════════════════════════════════════════════════════════
           RENDER SCENE LIST
           ═══════════════════════════════════════════════════════════ */
        function renderSceneList() {
            const list = document.getElementById('sceneList');
            list.innerHTML = '';

            state.scenes.forEach((scene, idx) => {
                const item = document.createElement('div');
                item.className = 'scene-item' + (idx === currentSceneIdx ? ' active' : '');
                item.dataset.idx = idx;
                item.draggable = true;

                const isStart = scene.id === state.settings.startSceneId;

                item.innerHTML = `
      <span class="scene-drag">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/>
          <circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/>
          <circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>
        </svg>
      </span>
      <img class="scene-thumb-sm" src="${scene.thumb}" alt="">
      <div class="scene-info">
        <strong>${scene.name}</strong>
        <span>${scene.hotspots.length} hotspot${isStart ? ' · ★ Bắt đầu' : ''}</span>
      </div>
      ${isStart ? '<span class="scene-badge">Start</span>' : ''}
    `;

                item.addEventListener('click', (e) => {
                    if (e.target.closest('.scene-drag')) return;
                    goToScene(idx);
                });

                // Drag & drop
                item.addEventListener('dragstart', (e) => {
                    item.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', idx);
                });
                item.addEventListener('dragend', () => item.classList.remove('dragging'));
                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    item.classList.add('drag-over');
                });
                item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    item.classList.remove('drag-over');
                    const from = parseInt(e.dataTransfer.getData('text/plain'));
                    const to = idx;
                    if (from !== to) reorderScenes(from, to);
                });

                list.appendChild(item);
            });

            document.getElementById('sceneCount').textContent =
                `${state.scenes.length} cảnh · Kéo để sắp xếp`;
        }

        function reorderScenes(from, to) {
            const [moved] = state.scenes.splice(from, 1);
            state.scenes.splice(to, 0, moved);
            if (from === currentSceneIdx) currentSceneIdx = to;
            else if (from < currentSceneIdx && to >= currentSceneIdx) currentSceneIdx--;
            else if (from > currentSceneIdx && to <= currentSceneIdx) currentSceneIdx++;

            markDirty();
            renderSceneList();
            toast('Đã sắp xếp lại danh sách cảnh');
        }

        /* ═══════════════════════════════════════════════════════════
           GO TO SCENE
           ═══════════════════════════════════════════════════════════ */
        function goToScene(idx) {
            if (idx < 0 || idx >= state.scenes.length) return;
            currentSceneIdx = idx;
            const scene = state.scenes[idx];

            const bg = document.getElementById('previewBg');
            bg.style.opacity = '0';
            setTimeout(() => {
                bg.style.backgroundImage = `url('${scene.img}')`;
                bg.style.opacity = '1';
            }, 200);

            selectedHotspotId = null;
            document.getElementById('breadcrumbScene').textContent = scene.name;
            document.getElementById('infoIdx').textContent = idx + 1;
            document.getElementById('infoTitle').textContent = scene.name;

            renderSceneList();
            renderPreviewHotspots();
            renderInspector();
        }

        /* ═══════════════════════════════════════════════════════════
           RENDER PREVIEW HOTSPOTS
           ═══════════════════════════════════════════════════════════ */
        function renderPreviewHotspots() {
            const canvas = document.getElementById('previewCanvas');
            canvas.querySelectorAll('.edit-hotspot').forEach(el => el.remove());

            const scene = state.scenes[currentSceneIdx];
            scene.hotspots.forEach(hs => {
                const el = document.createElement('div');
                el.className = `edit-hotspot ${hs.type}` + (hs.id === selectedHotspotId ? ' selected' : '');
                el.style.left = hs.x + '%';
                el.style.top = hs.y + '%';
                el.dataset.id = hs.id;

                const icon = hs.type === 'nav'
                    ? `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
           <path d="M12 4 L12 18"/><path d="M6 11 L12 5 L18 11"/>
         </svg>`
                    : `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round">
           <circle cx="12" cy="7" r="1.8" fill="white" stroke="none"/>
           <path d="M12 11 L12 18"/>
         </svg>`;

                el.innerHTML = `
      <div class="hs-circle">${icon}</div>
      <span class="hs-label">${hs.label}</span>
    `;

                // Click để chọn
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedHotspotId = hs.id;
                    renderPreviewHotspots();
                    renderInspector();
                });

                // Drag để di chuyển
                setupHotspotDrag(el, hs);

                canvas.appendChild(el);
            });
        }

        function setupHotspotDrag(el, hs) {
            let dragging = false;
            let startX, startY, startLeft, startTop;

            el.addEventListener('mousedown', (e) => {
                if (isPlacingHotspot) return;
                e.preventDefault();
                dragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startLeft = hs.x;
                startTop = hs.y;
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                const rect = document.getElementById('previewCanvas').getBoundingClientRect();
                const dx = ((e.clientX - startX) / rect.width) * 100;
                const dy = ((e.clientY - startY) / rect.height) * 100;
                hs.x = Math.max(0, Math.min(100, startLeft + dx));
                hs.y = Math.max(0, Math.min(100, startTop + dy));
                el.style.left = hs.x + '%';
                el.style.top = hs.y + '%';
                document.getElementById('infoCoord').textContent = `x: ${hs.x.toFixed(0)}% · y: ${hs.y.toFixed(0)}%`;
            });

            document.addEventListener('mouseup', () => {
                if (dragging) {
                    dragging = false;
                    document.body.style.userSelect = '';
                    markDirty();
                }
            });
        }

        /* ═══════════════════════════════════════════════════════════

          <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        Xóa cảnh này
      </button>
    </div>
  `;

            // Bind events
            document.getElementById('fieldName').addEventListener('input', (e) => {
                scene.name = e.target.value;
                document.getElementById('breadcrumbScene').textContent = scene.name;
                document.getElementById('infoTitle').textContent = scene.name;
                renderSceneList();
                markDirty();
            });
            document.getElementById('fieldDesc').addEventListener('input', (e) => {
                scene.desc = e.target.value;
                markDirty();
            });
            document.getElementById('fieldImgUrl').addEventListener('change', (e) => {
                const url = e.target.value.trim();
                if (url) {
                    scene.img = url;
                    scene.thumb = url;
                    document.getElementById('previewBg').style.backgroundImage = `url('${url}')`;
                    renderSceneList();
                    markDirty();
                    toast('Đã đổi URL ảnh panorama', 'success');
                }
            });
            document.getElementById('fieldOrder').addEventListener('change', (e) => {
                const newOrder = Math.max(0, Math.min(state.scenes.length - 1, parseInt(e.target.value) - 1));
                if (newOrder !== currentSceneIdx) {
                    reorderScenes(currentSceneIdx, newOrder);
                }
            });
            document.getElementById('isStartToggle').addEventListener('click', function () {
                if (state.settings.startSceneId === scene.id) {
                    this.classList.remove('on');
                    state.settings.startSceneId = null;
                } else {
                    state.settings.startSceneId = scene.id;
                    this.classList.add('on');
                }
                renderSceneList();
                markDirty();
            });
            document.getElementById('deleteSceneBtn').addEventListener('click', () => {
                if (state.scenes.length <= 1) { toast('Không thể xóa cảnh cuối cùng'); return; }
                if (!confirm('Xóa cảnh "' + scene.name + '"?')) return;
                state.scenes.splice(currentSceneIdx, 1);
                currentSceneIdx = Math.max(0, currentSceneIdx - 1);
                markDirty();
                renderSceneList();
                goToScene(currentSceneIdx);
                toast('Đã xóa cảnh', 'success');

            const fileInput = document.getElementById('realFileInput');
            document.getElementById('imgPicker').addEventListener('click', () => {
                fileInput.click();

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files && e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {

                        scene.img = dataUrl;
                        scene.thumb = dataUrl;
                        document.getElementById('pickerImgPreview').src = dataUrl;

            let listHtml = '';

           </svg>`
                        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
             <circle cx="12" cy="7" r="1.8" fill="currentColor" stroke="none"/>
             <path d="M12 11 L12 18"/>
           </svg>`;

          <div class="hotspot-row-icon ${hs.type}">${icon}</div>
          <span class="hotspot-row-name">${hs.label}</span>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
            </svg>
          </button>
        </div>
      `;
                }).join('');
            }

            const selected = scene.hotspots.find(h => h.id === selectedHotspotId);

            body.innerHTML = `
    <div class="insp-section">
      <div class="insp-section-title">
        <span>Hotspots trong cảnh (${scene.hotspots.length})</span>
      </div>
      <div class="hotspot-list">${listHtml}</div>

          <path d="M12 5v14M5 12h14"/>
        </svg>
        Thêm hotspot
      </button>
    </div>

    ${selected ? `
    <div class="insp-section">
      <div class="insp-section-title">Chỉnh sửa hotspot</div>
      <div class="field">
        <label>Nhãn hiển thị</label>
        <input type="text" id="hsLabel" value="${selected.label}">
      </div>
      ${selected.type === 'nav' ? `
      <div class="field">
        <label>Cảnh đích</label>
        <select id="hsTarget">
          <option value="">— Chọn cảnh —</option>
          ${state.scenes.map(s => `
            <option value="${s.id}" ${s.id === selected.target ? 'selected' : ''}>${s.name}</option>
          `).join('')}
        </select>
      </div>
      ` : `
      <div class="field">
        <label>Nội dung thông tin</label>
        <textarea id="hsContent" placeholder="Mô tả chi tiết địa điểm...">${selected.content || ''}</textarea>

      `}
      <div class="field-row">
        <div class="field">

    ` : ''}

            // Events
            body.querySelectorAll('.hotspot-row').forEach(row => {

                    selectedHotspotId = row.dataset.id;
                    renderPreviewHotspots();
                    renderInspector();
                });
            });
            body.querySelectorAll('[data-delete]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.delete;
                    scene.hotspots = scene.hotspots.filter(h => h.id !== id);
                    if (selectedHotspotId === id) selectedHotspotId = null;
                    markDirty();
                    renderSceneList();
                    renderPreviewHotspots();
                    renderInspector();
                    toast('Đã xóa hotspot');
                });
            });
            document.getElementById('quickAddHotspot')?.addEventListener('click', () => {
                startPlacingHotspot();
            });

            if (selected) {
                document.getElementById('hsLabel').addEventListener('input', (e) => {
                    selected.label = e.target.value;
                    renderPreviewHotspots();
                    renderHotspotsTab(body);
                    markDirty();
                });
                document.getElementById('hsTarget')?.addEventListener('change', (e) => {
                    selected.target = e.target.value;
                    markDirty();
                });
                document.getElementById('hsContent')?.addEventListener('input', (e) => {
                    selected.content = e.target.value;
                    markDirty();
                });
                document.getElementById('hsX').addEventListener('change', (e) => {
                    selected.x = Math.max(0, Math.min(100, parseFloat(e.target.value)));
                    renderPreviewHotspots();
                    markDirty();
                });
                document.getElementById('hsY').addEventListener('change', (e) => {
                    selected.y = Math.max(0, Math.min(100, parseFloat(e.target.value)));
                    renderPreviewHotspots();
                    markDirty();
                });
            }
        }

        function renderSettingsTab(body) {
            body.innerHTML = `
    <div class="insp-section">
      <div class="insp-section-title">Chế độ tour</div>
      <div class="field">
        <label>Kiểu trải nghiệm</label>
        <select id="setMode">
          <option value="free" ${state.settings.mode === 'free' ? 'selected' : ''}>Tự do khám phá</option>
          <option value="guided" ${state.settings.mode === 'guided' ? 'selected' : ''}>Có hướng dẫn (tự chuyển cảnh)</option>
        </select>
      </div>
      <div class="field">

        <input type="number" id="setDuration" value="${state.settings.guidedDuration}" min="3" max="60">
      </div>
      <div class="hint-text">Ở chế độ có hướng dẫn, tour tự động chuyển sang cảnh tiếp theo sau thời gian này.</div>
    </div>

    <div class="insp-section">
      <div class="insp-section-title">Cảnh bắt đầu</div>
      <div class="field">
        <select id="setStart">
          ${state.scenes.map(s => `
            <option value="${s.id}" ${s.id === state.settings.startSceneId ? 'selected' : ''}>${s.name}</option>
          `).join('')}

      </div>

        <div class="toggle ${state.settings.autoRotate ? 'on' : ''}" id="setAutoRotate"></div>
      </div>
      <div class="toggle-row">
        <label>Hiện bản đồ nhỏ</label>
        <div class="toggle ${state.settings.showMinimap ? 'on' : ''}" id="setMinimap"></div>
      </div>
    </div>
  `;

            document.getElementById('setMode').addEventListener('change', (e) => {
                state.settings.mode = e.target.value;
                markDirty();
            });
            document.getElementById('setDuration').addEventListener('input', (e) => {
                state.settings.guidedDuration = parseInt(e.target.value);
                markDirty();
            });
            document.getElementById('setStart').addEventListener('change', (e) => {
                state.settings.startSceneId = e.target.value;
                renderSceneList();
                markDirty();
            });
            document.getElementById('setAutoRotate').addEventListener('click', function () {
                this.classList.toggle('on');
                state.settings.autoRotate = this.classList.contains('on');
                markDirty();
            });
            document.getElementById('setMinimap').addEventListener('click', function () {
                this.classList.toggle('on');
                state.settings.showMinimap = this.classList.contains('on');
                markDirty();
            });
        }

        /* ═══════════════════════════════════════════════════════════
           PLACE HOTSPOT FLOW
           ═══════════════════════════════════════════════════════════ */
        function startPlacingHotspot() {
            isPlacingHotspot = true;
            document.getElementById('placeHint').classList.add('active');
            document.getElementById('previewCanvas').style.cursor = 'crosshair';
            toast('Click lên ảnh để đặt hotspot');
        }

        function cancelPlacing() {
            isPlacingHotspot = false;
            document.getElementById('placeHint').classList.remove('active');
            document.getElementById('previewCanvas').style.cursor = '';
        }

        document.getElementById('placeHotspotBtn').addEventListener('click', () => {
            if (isPlacingHotspot) cancelPlacing();
            else startPlacingHotspot();
        });

        document.getElementById('previewCanvas').addEventListener('click', (e) => {
            if (!isPlacingHotspot) return;
            if (e.target.closest('.edit-hotspot')) return;

            const rect = e.currentTarget.getBoundingClientRect();
            pendingHotspotPos = {
                x: ((e.clientX - rect.left) / rect.width) * 100,
                y: ((e.clientY - rect.top) / rect.height) * 100
            };
            cancelPlacing();
            openHotspotModal();
        });

        /* Modal chọn loại hotspot */
        const hotspotModal = document.getElementById('hotspotModal');
        function openHotspotModal() {
            hotspotModal.classList.add('open');
        }
        function closeHotspotModal() {
            hotspotModal.classList.remove('open');
            pendingHotspotPos = null;
        }
        document.querySelectorAll('[data-close-modal]').forEach(el => {
            el.addEventListener('click', closeHotspotModal);
        });
        hotspotModal.addEventListener('click', (e) => {
            if (e.target === hotspotModal) closeHotspotModal();
        });
        document.querySelectorAll('.type-card').forEach(card => {
            card.addEventListener('click', () => {
                const type = card.dataset.type;
                createHotspot(type);
                closeHotspotModal();
            });
        });

        function createHotspot(type) {
            if (!pendingHotspotPos) return;
            const scene = state.scenes[currentSceneIdx];
            const id = 'h' + Date.now();
            const newHs = {
                id,
                type,
                x: pendingHotspotPos.x,
                y: pendingHotspotPos.y,
                label: type === 'nav' ? 'Cảnh mới' : 'Thông tin',
                target: null,
                content: ''
            };
            scene.hotspots.push(newHs);
            selectedHotspotId = id;
            currentTab = 'hotspots';
            document.querySelectorAll('.insp-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'hotspots'));
            markDirty();
            renderSceneList();
            renderPreviewHotspots();
            renderInspector();
            toast('Đã thêm hotspot', 'success');
        }

        /* ═══════════════════════════════════════════════════════════
           TOGGLE PREVIEW MODE
           ═══════════════════════════════════════════════════════════ */
        function togglePreviewMode() {
            previewMode = !previewMode;
            document.body.classList.toggle('preview-mode', previewMode);
            document.getElementById('previewBtn').innerHTML = previewMode
                ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
         <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
       </svg>
       <span>Chỉnh sửa</span>`
                : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
         <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
       </svg>
       <span>Xem trước</span>`;
            if (previewMode) {
                toast('Đang ở chế độ xem trước — như người dùng thấy', 'success');
                if (state.settings.mode === 'guided') startGuidedMode();
            } else {
                stopGuidedMode();
            }
        }
        let guidedTimer = null;
        function startGuidedMode() {
            stopGuidedMode();
            guidedTimer = setInterval(() => {
                const next = (currentSceneIdx + 1) % state.scenes.length;
                goToScene(next);
            }, state.settings.guidedDuration * 1000);
        }
        function stopGuidedMode() {
            if (guidedTimer) clearInterval(guidedTimer);
            guidedTimer = null;
        }
        document.getElementById('previewBtn').addEventListener('click', togglePreviewMode);

        /* ═══════════════════════════════════════════════════════════
           ZOOM
           ═══════════════════════════════════════════════════════════ */
        function applyZoom() {
            const bg = document.getElementById('previewBg');
            bg.style.transform = `scale(${zoom / 100})`;
            document.getElementById('zoomLabel').textContent = zoom + '%';
        }
        document.getElementById('zoomIn').addEventListener('click', () => {
            zoom = Math.min(200, zoom + 10);
            applyZoom();
        });
        document.getElementById('zoomOut').addEventListener('click', () => {
            zoom = Math.max(50, zoom - 10);
            applyZoom();
        });

        /* ═══════════════════════════════════════════════════════════
           DRAG TO ROTATE (preview mode "drag")
           ═══════════════════════════════════════════════════════════ */
        document.querySelectorAll('.pt-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.pt-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const mode = tab.dataset.mode;
                document.getElementById('previewCanvas').classList.toggle('mode-drag', mode === 'drag');
            });
        });

        const previewCanvas = document.getElementById('previewCanvas');
        const previewBg = document.getElementById('previewBg');

        previewCanvas.addEventListener('mousedown', (e) => {
            if (isPlacingHotspot) return;
            if (!previewCanvas.classList.contains('mode-drag')) return;
            if (e.target.closest('.edit-hotspot')) return;
            dragState.active = true;
            dragState.startX = e.clientX;
            const match = previewBg.style.backgroundPosition.match(/([\d.]+)%/);
            dragState.bgX = match ? parseFloat(match[1]) : 50;
            previewBg.style.transition = 'none';
        });
        document.addEventListener('mousemove', (e) => {
            if (!dragState.active) return;
            const dx = e.clientX - dragState.startX;
            const newX = dragState.bgX + dx * 0.15;
            previewBg.style.backgroundPosition = `${newX}% center`;
            document.getElementById('infoCoord').textContent = `xoay: ${newX.toFixed(0)}%`;
        });
        document.addEventListener('mouseup', () => {
            if (dragState.active) {
                dragState.active = false;
                previewBg.style.transition = 'opacity 0.4s var(--ease)';
            }
        });

        /* ═══════════════════════════════════════════════════════════
           INSPECTOR TABS
           ═══════════════════════════════════════════════════════════ */
        document.querySelectorAll('.insp-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.insp-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                renderInspector();
            });
        });

        /* ═══════════════════════════════════════════════════════════
           SAVE / DIRTY STATE & UNDO/REDO HISTORY
           ═══════════════════════════════════════════════════════════ */
        let historyStack = [JSON.parse(JSON.stringify(state))];
        let historyIndex = 0;
        let isHistoryAction = false;

        function pushHistory() {
            if (isHistoryAction) return;
            const snap = JSON.stringify(state);
            if (snap === JSON.stringify(historyStack[historyIndex])) return;
            historyStack = historyStack.slice(0, historyIndex + 1);
            historyStack.push(JSON.parse(snap));
            historyIndex = historyStack.length - 1;
        }

        function markDirty() {
            isDirty = true;
            pushHistory();
            const ind = document.getElementById('saveIndicator');
            ind.classList.remove('saving');
            ind.classList.add('dirty');
            document.getElementById('saveText').textContent = 'Có thay đổi chưa lưu';
        }

        function markSaved() {
            isDirty = false;
            const ind = document.getElementById('saveIndicator');
            ind.classList.remove('dirty', 'saving');
            document.getElementById('saveText').textContent = 'Đã lưu';
        }

        function undo() {
            if (historyIndex > 0) {
                isHistoryAction = true;
                historyIndex--;
                const prev = JSON.parse(JSON.stringify(historyStack[historyIndex]));
                Object.assign(state, prev);
                currentSceneIdx = Math.min(currentSceneIdx, state.scenes.length - 1);
                isDirty = true;
                renderSceneList();
                goToScene(currentSceneIdx);
                isHistoryAction = false;
                toast('Đã hoàn tác (Undo)', 'success');
            } else {
                toast('Không còn thao tác nào để hoàn tác');
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                isHistoryAction = true;
                historyIndex++;
                const next = JSON.parse(JSON.stringify(historyStack[historyIndex]));
                Object.assign(state, next);
                currentSceneIdx = Math.min(currentSceneIdx, state.scenes.length - 1);
                isDirty = true;
                renderSceneList();
                goToScene(currentSceneIdx);
                isHistoryAction = false;
                toast('Đã làm lại (Redo)', 'success');
            } else {
                toast('Không còn thao tác nào để làm lại');
            }
        }

        document.getElementById('saveBtn').addEventListener('click', () => {
            if (!isDirty) { toast('Không có thay đổi nào'); return; }
            const ind = document.getElementById('saveIndicator');
            ind.classList.add('saving');
            document.getElementById('saveText').textContent = 'Đang lưu...';
            setTimeout(() => {
                markSaved();
                toast('Đã lưu thay đổi', 'success');
            }, 700);
        });
        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('redoBtn').addEventListener('click', redo);

        /* ═══════════════════════════════════════════════════════════
           ADD SCENE
           ═══════════════════════════════════════════════════════════ */
        document.getElementById('addSceneBtn').addEventListener('click', () => {
            const newScene = {
                id: 's' + Date.now(),
                name: 'Cảnh mới',
                img: 'https://picsum.photos/id/1036/2400/1200',
                thumb: 'https://picsum.photos/id/1036/200/120',
                desc: 'Mô tả cảnh mới',
                hotspots: []
            };
            state.scenes.push(newScene);
            currentSceneIdx = state.scenes.length - 1;
            markDirty();
            renderSceneList();
            goToScene(currentSceneIdx);
            toast('Đã thêm cảnh mới', 'success');
        });

        /* ═══════════════════════════════════════════════════════════
           TOAST
           ═══════════════════════════════════════════════════════════ */
        function toast(msg, type = '') {
            const wrap = document.getElementById('toastWrap');
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            el.innerHTML = type === 'success'
                ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>${msg}`
                : msg;
            wrap.appendChild(el);
            setTimeout(() => {
                el.style.transition = 'opacity 0.3s, transform 0.3s';
                el.style.opacity = '0';
                el.style.transform = 'translateY(8px)';
                setTimeout(() => el.remove(), 320);
            }, 2200);
        }

        /* ═══════════════════════════════════════════════════════════
           KEYBOARD SHORTCUTS
           ═══════════════════════════════════════════════════════════ */
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.key === 'Escape') {
                if (hotspotModal.classList.contains('open')) closeHotspotModal();
                else if (isPlacingHotspot) cancelPlacing();
                else if (selectedHotspotId) {
                    selectedHotspotId = null;
                    renderPreviewHotspots();
                    renderInspector();
                }
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                document.getElementById('saveBtn').click();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                if (e.shiftKey) redo();
                else undo();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                e.preventDefault();
                redo();
            }
            if (e.key === 'ArrowDown' && e.altKey) {
                e.preventDefault();
                goToScene(Math.min(state.scenes.length - 1, currentSceneIdx + 1));
            }
            if (e.key === 'ArrowUp' && e.altKey) {
                e.preventDefault();
                goToScene(Math.max(0, currentSceneIdx - 1));
            }
        });

        /* ═══════════════════════════════════════════════════════════
           INIT
           ═══════════════════════════════════════════════════════════ */
        renderSceneList();
        renderPreviewHotspots();
        renderInspector();
    </script>

</body>
